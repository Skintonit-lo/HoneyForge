<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Honeypot Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #e94560;
            border-bottom: 2px solid #e94560;
            padding-bottom: 10px;
        }
        .counter {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .counter .number {
            font-size: 48px;
            color: #e94560;
            font-weight: bold;
        }
        .counter .label {
            font-size: 14px;
            color: #888;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #16213e;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2a2a4a;
        }
        th {
            background: #1a1a2e;
            color: #e94560;
            font-weight: bold;
        }
        tr:hover {
            background: #1f1f3a;
        }
        .chart-container {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
        }
        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>🛡️ Honeypot Dashboard</h1>

    <div class="counter">
        <div class="number" id="total-attacks">0</div>
        <div class="label"><span class="status"></span>Всего зафиксированных атак</div>
    </div>

    <table id="attacks-table">
        <thead>
            <tr>
                <th>Время</th>
                <th>IP</th>
                <th>Логин</th>
                <th>Пароль</th>
                <th>User-Agent</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="chart-container">
        <h2>Атак по часам</h2>
        <canvas id="attacks-chart"></canvas>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api/attacks';
        let chart = null;

        async function fetchAttacks() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                updateCounter(data.length);
                updateTable(data);
                updateChart(data);
            } catch (error) {
                console.error('Ошибка загрузки:', error);
            }
        }

        function updateCounter(count) {
            document.getElementById('total-attacks').textContent = count;
        }

        function updateTable(attacks) {
            const tbody = document.querySelector('#attacks-table tbody');
            tbody.innerHTML = '';
            attacks.slice(0, 20).forEach(a => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${a.time ? a.time.slice(0, 19).replace('T', ' ') : '-'}</td>
                    <td>${a.ip || '-'}</td>
                    <td>${a.username || '-'}</td>
                    <td>${a.password || '-'}</td>
                    <td>${a.user_agent ? a.user_agent.slice(0, 50) + '...' : '-'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateChart(attacks) {
            const hours = {};
            attacks.forEach(a => {
                if (a.time) {
                    const hour = a.time.slice(11, 13);
                    hours[hour] = (hours[hour] || 0) + 1;
                }
            });

            const labels = Object.keys(hours).sort();
            const values = labels.map(h => hours[h]);

            const ctx = document.getElementById('attacks-chart').getContext('2d');
            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Атак за час',
                        data: values,
                        backgroundColor: '#e94560',
                        borderColor: '#e94560',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: '#e0e0e0' } }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#e0e0e0' },
                            grid: { color: '#2a2a4a' }
                        },
                        x: {
                            ticks: { color: '#e0e0e0' },
                            grid: { color: '#2a2a4a' }
                        }
                    }
                }
            });
        }

        fetchAttacks();
        setInterval(fetchAttacks, 5000);
    </script>
</body>
</html>
